name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vorschau: das ganze Spiel als eine einzige HTML-Datei.
      # Erscheint im Lauf unter „Artifacts“ als „fussball-simulator-vorschau“.
      - run: npm run build:single
        env:
          # Bei PRs den Commit des Branches anzeigen, nicht den Merge-Commit.
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: fussball-simulator-vorschau
          path: dist-single/index.html
          retention-days: 30
          if-no-files-found: error
